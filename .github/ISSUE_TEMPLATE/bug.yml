name: Bug
description: Something behaves differently from what the code or docs say.
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened. Include the exact command and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How to prove the fix, as checkable statements.
      value: |
        - [ ]
    validations:
      required: true
